const D={pantry:['🍽️','配膳室'],toilet:['🚻','公共廁所'],water:['🚰','飲水機'],trash:['♻️','垃圾／廚餘'],laundry:['👕','洗衣／烘衣'],linen:['🛏️','被服室'],microwave:['🍲','微波爐／量身高體重'],utility:['🧺','污物室'],exit:['🚪','玻璃門出口／甲梯'],station:['👩‍⚕️','護理站']};let l='zh',room='',speech='';

 tw:{L:'倒手爿轉',R:'正手爿轉',S:'直直行',C:'閣繼續直直行',room:n=>`${n}病房`,toilet:'公家便所',pantry:'配膳室',linen:'被服室',treat:'治療室',utility:'污物室',micro:'微波爐佮量身懸、磅體重的所在',glass:'玻璃門',staff:'若無確定方向，請問護理人員。'},

function route(r,k){
 let q=LTEXT[l], target=['water','trash','laundry'].includes(k)?'pantry':k;

  say('往前走，第一個路口右手邊第一間就是配膳室。','向頭前行，頭一个路口正手爿頭一間就是配膳室。','Continue ahead. Just past the first intersection, the first room on your right is the pantry.','Terus maju. Setelah persimpangan pertama, ruangan pertama di kanan adalah pantry.','Tiếp tục đi. Qua ngã rẽ đầu tiên, phòng đầu tiên bên phải là phòng pantry.','そのまま進み、最初の交差部を過ぎた右手の最初の部屋が配膳室です。')];

 if(r==='1058'&&target==='pantry')return[

  say('走到底的玻璃門就是病房出口。','行到路尾的玻璃門就是病房出口。','The glass door at the end is the ward exit.','Pintu kaca di ujung adalah pintu keluar bangsal.','Cửa kính ở cuối hành lang là lối ra của khu bệnh.','突き当たりのガラス扉が病棟出口です。')];

 if(r==='1058'&&['toilet','linen','microwave','utility'].includes(target)){
  let end={
   toilet:say('右轉後，右手邊馬上就是公共廁所。','正手爿轉了後，正手爿隨就是公家便所。','After turning right, the public restroom is immediately on your right.','Setelah belok kanan, toilet umum langsung berada di sebelah kanan.','Sau khi rẽ phải, nhà vệ sinh công cộng ở ngay bên phải.','右折すると、すぐ右手が共用トイレです。'),
   linen:say('經過公共廁所後繼續直走，通過下一個路口，左手邊第一間就是被服室。','經過公家便所閣直直行，過後一个路口，倒手爿頭一間就是被服室。','Pass the public restroom and continue straight. After the next intersection, the first room on your left is the linen room.','Lewati toilet umum dan terus jalan lurus. Setelah persimpangan berikutnya, ruangan pertama di kiri adalah ruang linen.','Đi qua nhà vệ sinh công cộng và tiếp tục đi thẳng. Qua ngã rẽ tiếp theo, phòng đầu tiên bên trái là phòng đồ vải.','共用トイレを通り過ぎて直進し、次の交差部を過ぎると左手の最初の部屋がリネン室です。'),
   microwave:say('經過被服室後是治療室；治療室相對的右手邊就是微波爐與量身高體重區。','經過被服室了後是治療室；治療室對面的正手爿就是微波爐佮量身懸、磅體重的所在。','After the linen room is the treatment room. Opposite the treatment room, on your right, are the microwave and height/weight measurement area.','Setelah ruang linen adalah ruang tindakan. Di seberang ruang tindakan, di sebelah kanan, terdapat microwave dan area pengukuran tinggi/berat badan.','Sau phòng đồ vải là phòng điều trị. Đối diện phòng điều trị, bên phải là lò vi sóng và khu đo chiều cao/cân nặng.','リネン室の次が処置室です。処置室の向かい側右手に、電子レンジと身長・体重測定場所があります。'),

  return[
